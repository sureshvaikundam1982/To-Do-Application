
version: 2.1

jobs:
  build:
    docker:
      - image: docker:24.0.5

    steps:
      - checkout
      - setup_remote_docker

      - run:
          name: Login to Docker Hub
          command: |
            set -e
            printf '%s' "$DOCKERHUB_PASSWORD" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

      - run:
          name: Verify Dockerfile
          command: |
            set -e
            echo "Branch: $CIRCLE_BRANCH"
            echo "Commit: $CIRCLE_SHA1"
            cat Dockerfile

            grep -q '^FROM python:3.11-slim' Dockerfile

      - run:
          name: Build Docker Image
          command: |
            set -e
            docker build --no-cache --pull \
              -t "$DOCKERHUB_USERNAME/todo_app:latest" .

      - run:
          name: Push Docker Image
          command: |
            set -e
            docker push "$DOCKERHUB_USERNAME/todo_app:latest"

  deploy:
    docker:
      - image: google/cloud-sdk:slim

    steps:
      - checkout

      - run:
          name: Install Kubernetes Tools
          command: |
            set -e
            apt-get update
            apt-get install -y kubectl google-cloud-cli-gke-gcloud-auth-plugin

            kubectl version --client
            gke-gcloud-auth-plugin --version

      - run:
          name: Configure gcloud
          command: |
            set -e

            printf '%s' "$GCLOUD_SERVICE_KEY" > key.json

            gcloud auth activate-service-account \
              --key-file=key.json

            gcloud config set project "$GCLOUD_PROJECT_ID"

            gcloud container clusters get-credentials whizlabs-cluster \
              --region us-central1 \
              --project "$GCLOUD_PROJECT_ID"

            rm -f key.json

      - run:
          name: Deploy to Kubernetes
          command: |
            set -e
            kubectl apply -f Deployment.yaml

      - run:
          name: Verify Kubernetes Deployment
          command: |
            set -e
            kubectl get deployments

            for deployment in $(kubectl get deployments -o name); do
              kubectl rollout status "$deployment" --timeout=180s
            done

            kubectl get pods
            kubectl get services

workflows:
  build-and-deploy:
    jobs:
      - build:
          context: my-context

      - deploy:
          context: my-context
          requires:
            - build
